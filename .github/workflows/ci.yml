name: CI

# Runs on every push/PR so a broken build never lands on main unnoticed.
# Two jobs: `test` (the ~85 unit/integration tests, all self-contained
# scripts — no real Mongo or Gemini needed, see backend/README.md) and
# `docker-build` (builds the production image — fails the same way a bad
# Dockerfile change would fail on Render/App Runner, just earlier and
# free). docker-build only runs after test passes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Dummy values — the test suite never makes a real Mongo or Gemini
      # call: Mongo is mocked with mongomock-motor, and every agent/router
      # test injects a fake LLM/embedding provider (see tests/fake_*.py).
      # JWT_SECRET_KEY still has to be a real-looking string because
      # core/security_startup.py validates its length even outside
      # production, and auth/jwt_handler.py needs *something* to sign with.
      JWT_SECRET_KEY: ci-test-secret-key-not-for-production-use-0000
      MONGO_URI: mongodb://localhost:27017
      MONGO_DB_NAME: techmart_support_ci
      GEMINI_API_KEY: ""
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        run: |
          set -e
          status=0
          for f in tests/test_*.py; do
            echo "::group::$f"
            python "$f" || status=1
            echo "::endgroup::"
          done
          exit $status

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: techmart-support-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
